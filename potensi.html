<!DOCTYPE html>

<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profil Desa Mojayan</title>

<link rel="icon" type="image/jpeg" href="logo-desa.jpeg">

<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
<div class="logo">
<img src="logo-desa.jpeg" alt="Logo Desa">
<span>DESA MOJAYAN</span>
</div>

<nav>
<a href="index.html">Beranda</a>
<a href="profil.html">Profil</a>
<a href="potensi.html">Potensi</a>
<a href="kegiatan.html">Kegiatan</a>
<a href="berita.html">Berita</a>
<a href="Download.html">Download</a>
</nav>

<div class="logo-klaten">
<img src="logo-klaten.jpeg" alt="Logo Klaten">
</div>
</header>

<section id="potensi">

<h2>Potensi Desa</h2>

<div class="grid">

<div class="card">
<h3>Pertanian</h3>
<img src="pertanian.jpeg" alt="Pertanian" onclick="openImage(this.src)">
</div>

<div class="card">
<h3>Peternakan</h3>
<img src="peternakan.jpeg" alt="Peternakan" onclick="openImage(this.src)">
</div>

<div class="card">
<h3>UMKM</h3>
<img src="umkm.jpeg" alt="UMKM" onclick="openImage(this.src)">
</div>

<div class="card">
<h3>Pendidikan</h3>
<img src="pendidikan.jpeg" alt="Pendidikan" onclick="openImage(this.src)">
</div>

</div>

</section>
  
<!-- Popup Gambar -->
<div id="popup" class="popup" onclick="closeImage()">
    <img id="popup-img">
    <span style="color:white;position:absolute;top:20px;right:30px;font-size:40px;">✕</span>
</div>

<script>
function openImage(src){
    document.getElementById("popup").style.display = "flex";
    document.getElementById("popup-img").src = src;
}

function closeImage(){
    document.getElementById("popup").style.display = "none";
}
</script>
  
</body>
</html>
